[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-report-skill"
version = "0.1.0"
description = "Template-preserving, source-traceable editable report presentations"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0", "lxml>=5", "Pillow>=10", "PyMuPDF>=1.24,<1.27", "python-docx>=1.1", "openpyxl>=3.1", "fonttools>=4.50"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.8"]

[project.scripts]
ppt-report = "ppt_report_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["render: requires actual LibreOffice/soffice rendering"]
