name: Public package checks
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-impress fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not private_template'
      - run: python -m ppt_report_skill.cli doctor --smoke --output output/ci-doctor
      - run: python scripts/setup.py --agent none --venv .setup-check
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ppt-report-skill
          path: .dist/*
